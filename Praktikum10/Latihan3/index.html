<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <header class="gallery-header">
            <h1>Moments</h1>
            <p>A CSS Grid visual experience</p>
        </header>

        <main class="grid-gallery">
            <div class="grid-item item-wide">
                <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?q=80&w=800&auto=format&fit=crop" alt="Gallery Image 1">
                <div class="overlay"><span>Nature</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1494500764479-0c8f2919a3d8?q=80&w=400&auto=format&fit=crop" alt="Gallery Image 2">
                <div class="overlay"><span>Landscape</span></div>
            </div>
            <div class="grid-item item-tall">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=400&auto=format&fit=crop" alt="Gallery Image 3">
                <div class="overlay"><span>Ocean</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?q=80&w=400&auto=format&fit=crop" alt="Gallery Image 4">
                <div class="overlay"><span>Forest</span></div>
            </div>
            <div class="grid-item item-large">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=800&auto=format&fit=crop" alt="Gallery Image 5">
                <div class="overlay"><span>Mountains</span></div>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=400&auto=format&fit=crop" alt="Gallery Image 6">
                <div class="overlay"><span>Valley</span></div>
            </div>
        </main>
    </div>
</body>
</html>
