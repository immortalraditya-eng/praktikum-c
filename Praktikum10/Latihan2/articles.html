<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Mainstream Navbar - Articles</title>
    <link rel="stylesheet" href="style.css">
    <!-- Phosphor Icons for modern iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    
    <div class="background-grid"></div>

    <!-- Floating Dock Navbar -->
    <nav class="floating-dock">
        <a href="index.html" class="logo-circle" aria-label="Home">
            <i class="ph-fill ph-aperture"></i>
        </a>
        
        <div class="nav-separator"></div>

        <ul class="dock-links">
            <li>
                <a href="about.html" class="dock-item">
                    <i class="ph ph-user"></i>
                    <span class="tooltip">About</span>
                </a>
            </li>
            <li>
                <a href="projects.html" class="dock-item">
                    <i class="ph ph-briefcase"></i>
                    <span class="tooltip">Projects</span>
                </a>
            </li>
            <li>
                <a href="articles.html" class="dock-item" style="color: #fff; background: rgba(255, 255, 255, 0.1);">
                    <i class="ph ph-article"></i>
                    <span class="tooltip">Articles</span>
                </a>
            </li>
        </ul>

        <div class="nav-separator"></div>

        <div class="dock-actions">
            <a href="contact.html" class="btn-neo">
                <i class="ph ph-paper-plane-tilt"></i> Say Hello
            </a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-badge">Articles Page</div>
        <h1 class="hero-title">Thoughts &<br>Musings.</h1>
        <p class="hero-desc">Tutorials, ideas, and occasional rants about the web.</p>
    </main>

    <!-- Dummy spacer for scrolling -->
    <div style="height: 150vh;"></div>

</body>
</html>
