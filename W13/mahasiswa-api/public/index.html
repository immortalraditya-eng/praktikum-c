<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Mahasiswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Data Mahasiswa</h2>
            <p>Manajemen data mahasiswa sederhana menggunakan Node.js dan REST API</p>
        </header>

        <section class="form-section">
            <div class="input-group">
                <input type="text" id="nama" placeholder="Nama Lengkap">
                <input type="text" id="nim" placeholder="NIM">
                <input type="text" id="prodi" placeholder="Program Studi">
                <button onclick="simpan()" class="btn-primary">Simpan Data</button>
            </div>
        </section>

        <section class="table-section">
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Program Studi</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelMahasiswa">
                    <!-- Data dimuat dari script.js -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
